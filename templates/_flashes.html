{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}
<div class="flashes" aria-live="polite">
  {% for cat, msg in messages %}<div class="alert alert-{{ cat }}" role="{{ 'alert' if cat == 'error' else 'status' }}">{{ msg }}</div>{% endfor %}
</div>
{% endif %}
{% endwith %}
